<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/6a643c0bd5.js" crossorigin="anonymous"></script>
</head>

<body>
    <header>
        <div class="parent">


            <div id="search" class="navbar">
                <div style="margin-right:15px;"><i class="fa-brands fa-spotify fa-2xl"></i></div>
                <a href="index.html" class="space" id="home"><i class="fa-solid fa-house fa-xl"></i></a>
                <form>

                    <div class="search-bar">
                        <i class="fa-solid fa-magnifying-glass fa-xl"></i>
                        <input type="text" placeholder="What do you want to play?">
                        <span id="separator1">|</span>
                        <a href="browse.html" target="_self">
                            <span id="browse">
                                <i class="fa-regular fa-window-maximize fa-xl"></i>
                            </span>
                        </a>
                    </div>
                </form>


            </div>

            <div id="features">

                <div class="other">
                    <span><a href="#">Premium</a></span>
                    <span><a href="#">Support</a></span>
                    <span><a href="#">Download</a></span>

                </div>


                <span style="font-size: 31px;font-weight:100;align-self:flex-start;" id="separator2">|</span>


                <div id="sign">
                    <div id="install">
                        <span><i class="fa-regular fa-circle-down"></i></span>
                        <a href="#">Install app</a>
                    </div>
                    <a href="#">Sign up</a>
                </div>

                <span id="login">Log in</span>

            </div>
        </div>

    </header>



    <main>
        <div class="section">

            <div id="section1">
                <div class="title">
                    <span id="library">Your Library</span>
                    <button id="create"><span style="font-size:30px;font-weight:normal;">+</span> <span
                            style="padding:2px;">Create</span></button>
                </div>
                <div class="box">
                    <span style="font-size: 15px;font-weight: 600;" class="line">Create your first playlist </span>

                    <span style="font-size: 14px;">It's easy , we'll help you</span>
                    <br>
                    <button class="play">Create playlist</button>

                </div>
                <div class="box" id="box2">
                    <span class="line">Create your first playlist </span>
                    <span style="font-size: 14px;">It's easy , we'll help you</span>
                    <br>
                    <button class="play" id="play2">Browse podcasts</button>

                </div>
                <div class="foot">
                    <a href="#">Legal</a>
                    <a href="#">Safety&PrivacyCenter</a>
                    <a href="#">PrivacyPolicy</a>
                    <a href="#">Cookies</a>
                    <a href="#">About Ads</a>
                    <a href="#">Accessibility</a>



                </div>
                <a href="#" id="last-item">Cookies</a>

                <div>

                </div>
                <button id="lang">
                    <i class="fa-solid fa-globe"></i><span> English</span>
                </button>
            </div>

            <div id="section3">
                <div id="container2">
                    <span id="card2">Chill</span>
                    <div id="charts" class="charts3">
                        <span style="font-size: 24px;font-weight: 600;">Popular chill playlists</span>
                        <a href="#" class="show">Show all</a>
                    </div>


                    <div id="content" class="content4">
                        <div>
                            <figure>
                                <a href="#"><img src="images/b1.png" alt="b1"></a>
                                <a href="" class="caption">Bollywood & Chill</a>
                                <figcaption>Sit back,and chill with Bollywood's easygoing...<figcaption>

                            </figure>
                        </div>
                        <div>
                            <figure>
                                <a href="#"><img src="images/b2.png" alt="b2"></a>
                                <a href="" class="caption">Kolly Chill Out</a>
                                <figcaption>Cool Tracks from Kollywood</figcaption>

                            </figure>
                        </div>
                        <div>
                            <figure>
                                <a href="#"><img src="images/b3.png" alt="b3 "></a>
                                <a href="" class="caption">Chai&Classics</a>
                                <figcaption>A cup of tea served with some retro tunes.</figcaption>

                            </figure>
                        </div>
                        <div>
                            <figure>
                                <a href="#"><img src="images/b4.png" alt="b4"></a>
                                <a href="" class="caption">Hangover Cure</a>
                                <figcaption>Trust us,you need this!</figcaption>
                                
                            </figure>
                        </div>
                        <div>
                            <figure>
                                <a href="#"><img src="images/b5.png" alt="b5"></a>
                                <a href="" class="caption">Lofi Vibe Hindi</a>
                                <figcaption>Inhale & exhale to the beats of Lofi.</figcaption>

                            </figure>
                        </div>
                    </div>

                </div>
            </div>

        </div>

        </div>
        </div>
        </div>
    </main>




</body>
</body>

</html>
