<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify</title>
    <link rel="stylesheet" href="signup.css">
    <script src="https://kit.fontawesome.com/6a643c0bd5.js" crossorigin="anonymous"></script>

</head>
<body>
    <div id="signup">

        <i class="fa-brands fa-spotify fa-2xl" ></i>
        <div id="heading" class=" child">Welcome back</div>
        
        <form>
        <div><label for="email" class="child" >Email</label></div>
        <div><input type="email" id="email" name="email" class="child" ></div>
        <div><button id="continue">Continue</button></div>
        <div id="or">or</div>
        <div class="buttons">
        <div><button > <i class="fa-solid fa-mobile fa-xl" ></i><span style="margin-left:-15px;">Continue with phone number</span></button></div>
        <div><button ><i class="fa-brands fa-google fa-xl"style="margin:right 20"></i>Continue with Google</button></div>
        <div><button ><i class="fa-brands fa-facebook fa-xl" "></i>Continue with Facebook</button></div>
        <div><button ><i class="fa-brands fa-apple fa-2xl"></i>Continue with Apple</button></div>
        
        <div id="msg">Don't have an account?</div>
        <div id="link"><a href="login.html" class="link">Sign up</a></div>
    
        </div>

        </form>
        
    </div>
</body>
</html>
