<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/6a643c0bd5.js" crossorigin="anonymous"></script>
</head>

<body>
    <header>
        <div class="parent">


            <div id="search" class="navbar">
                <div style="margin-right:15px;"><i class="fa-brands fa-spotify fa-2xl"></i></div>
                <a href="index.html" class="space" id="home"><i class="fa-solid fa-house fa-xl"></i></a>
                <form>

                    <div class="search-bar">
                        <i class="fa-solid fa-magnifying-glass fa-xl"></i>
                        <input type="text" placeholder="What do you want to play?">
                        <span id="separator1">|</span>
                        <a href="browse.html" target="_self"><span id="browse"><i
                                    class="fa-regular fa-window-maximize fa-xl"></i></span></a>

                    </div>
                </form>


            </div>

            <div id="features">

                <div class="other">
                    <span><a href="#">Premium</a></span>
                    <span><a href="#">Support</a></span>
                    <span><a href="#">Download</a></span>

                </div>


                <span style="font-size: 31px;font-weight:100;align-self:flex-start;" id="separator2">|</span>


                <div id="sign">
                    <div id="install">
                        <span><i class="fa-regular fa-circle-down"></i></span>
                        <a href="#">Install app</a>
                    </div>
                    <a href="signup.html">Sign up</a>
                </div>

                <a href="login.html" id="login-text"><span id="login">Log in</span></a>

            </div>
        </div>

    </header>



    <main>
        <div class="section">

            <div id="section1">
                <div class="title">
                    <span id="library">Your Library</span>
                    <button id="create"><span style="font-size:30px;font-weight:normal;">+</span> <span
                            style="padding:2px;">Create</span></button>
                </div>
                <div class="box">
                    <span style="font-size: 15px;font-weight: 600;" class="line">Create your first playlist </span>

                    <span style="font-size: 14px;">It's easy , we'll help you</span>
                    <br>
                    <button class="play">Create playlist</button>

                </div>
                <div class="box" id="box2">
                    <span class="line">Create your first playlist </span>
                    <span style="font-size: 14px;">It's easy , we'll help you</span>
                    <br>
                    <button class="play" id="play2">Browse podcasts</button>

                </div>
                <div class="foot">
                    <a href="#">Legal</a>
                    <a href="#">Safety&PrivacyCenter</a>
                    <a href="#">PrivacyPolicy</a>
                    <a href="#">Cookies</a>
                    <a href="#">About Ads</a>
                    <a href="#">Accessibility</a>
                </div>
                <a href="#" id="last-item">Cookies</a>

                <button id="lang">
                    <i class="fa-solid fa-globe"></i><span> English</span>
                </button>
            </div>

            <div id="section2">
                <div id="container">
                    <div id="charts">
                        <span style="font-size: 24px;font-weight: 600;">Featured Charts</span>
                        <a href="#" class="show">Show all</a>
                    </div>
                    <div id="content">
                        <div>
                            <figure>
                                <a href="#"><img src="images/Global_songs.png" alt="Global songs"></a>
                                <figcaption>Your weekly update of the most played tracks...</figcaption>

                            </figure>
                        </div>
                        <div>
                            <figure>
                                <a href="#"><img src="images/Indian_songs.png" alt="Indian songs"></a>
                                <figcaption>Your weekly update of the most played tracks...</figcaption>

                            </figure>
                        </div>
                        <div>
                            <figure>
                                <a href="#"><img src="images/Global_50.png" alt="Top 50 Global "></a>
                                <figcaption>Your daily update of the most played tracks righ...</figcaption>

                            </figure>
                        </div>
                        <div>
                            <figure>
                                <a href="#"><img src="images/Indian_50.png" alt="Top 50 Indian"></a>
                                <figcaption>Your daily update of the most played tracks righ...</figcaption>

                            </figure>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </main>




</body>
</body>

</html>
